<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<title>Girių inspekcija</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#1c372b;background:#e9eee8;--forest:#133d31;--green:#236a50;--line:#dae5dc;--muted:#728176;--paper:#fff;--gold:#edd19c;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8bbd9d;outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--green)}.shell{max-width:630px;min-height:100dvh;margin:auto;background:#f7f9f5;box-shadow:0 10px 56px #143a2b18;display:flex;flex-direction:column}
.header{background:linear-gradient(125deg,#0d3329,#205440 90%);color:white;padding:23px 21px 20px;border-radius:0 0 23px 23px}.top{display:flex;align-items:center;gap:12px}.logo{height:45px;width:45px;border-radius:12px;display:grid;place-items:center;background:#fffdf2;border:1px solid #ffffff49;flex-shrink:0}.logo img{width:43px;height:43px;object-fit:contain;display:block}.branding{font-weight:850;font-size:17px;letter-spacing:-.3px;line-height:1.05}.branding small{display:block;font-size:10px;letter-spacing:1.45px;font-weight:700;color:#cce4d6;margin-top:5px}.pill{margin-left:auto;border:1px solid #f5d9a6;background:#8f64332e;border-radius:30px;color:#fff1c7;padding:7px 9px;font-size:10px;font-weight:800;white-space:nowrap}.intro{font-size:26px;font-weight:850;letter-spacing:-.6px;margin:22px 0 5px}.desc{margin:0;font-size:13px;color:#d5e7dd;line-height:1.55}.who{display:flex;align-items:center;gap:8px;margin-top:18px}.who label{font-size:11px;color:#d4e7db;white-space:nowrap}.who select{flex:1;min-width:0;background:#f8fff7;color:#163b2c;border:0;border-radius:10px;padding:11px 9px;font-weight:700;font-size:12px}.not-live{background:#fff5df;border:1px solid #f0dfb9;color:#795b23;font-size:12px;line-height:1.48;padding:12px 14px;border-radius:13px;margin:16px 0 0}
main{flex:1;padding:22px 18px 115px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:21px}.kpi{background:white;border:1px solid var(--line);border-radius:15px;padding:14px 10px}.kpi strong{font-size:25px;display:block;line-height:1;color:#1d553f}.kpi span{display:block;font-size:11px;color:var(--muted);margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.row h2{font-size:21px;letter-spacing:-.4px;margin:0 0 12px}.tiny{font-size:12px;color:#718075}.stack{display:flex;flex-direction:column;gap:12px}.task,.panel{border:1px solid var(--line);background:#fff;border-radius:18px;padding:17px;box-shadow:0 4px 20px #24463208}.task h3{font-size:17px;letter-spacing:-.2px;margin:13px 0 7px}.task p,.panel p{font-size:13px;color:#6c796e;line-height:1.6;margin:8px 0}.task .topline{display:flex;align-items:center;justify-content:space-between;gap:7px}.status{font-size:11px;font-weight:800;padding:6px 9px;border-radius:20px;background:#e8f4ec;color:#246345}.status.new{background:#fff2d9;color:#856026}.status.submitted{background:#e8f1ff;color:#2d628d}.status.approved{background:#ecedee;color:#526459}.divider{height:1px;background:#e9efea;margin:14px 0}.tag{font-size:11px;color:#79877c}.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:2px 0 16px;padding-bottom:2px}.chip{border:1px solid #dbe6de;border-radius:99px;background:#fff;color:#58705f;font-weight:750;padding:8px 12px;white-space:nowrap;font-size:12px}.chip.active{background:#235e48;border-color:#235e48;color:#fff}.primary,.secondary,.soft{padding:12px 14px;border-radius:12px;font-size:13px;font-weight:800;border:0}.primary{color:white;background:var(--green)}.secondary{color:#225a43;background:#eaf4ec}.soft{color:#315d48;background:white;border:1px solid var(--line)}.block{width:100%}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1}.field{margin:12px 0}.field label{font-size:12px;font-weight:800;color:#385b47;display:block;margin-bottom:7px}.field input,.field select,.field textarea{border:1px solid #cad9cd;background:#fff;border-radius:12px;padding:11px;width:100%;font-size:14px;color:#1b372b}.field textarea{min-height:94px;resize:vertical}.field .help{font-size:11px;color:#77877a;margin-top:4px;display:block}.empty{text-align:center;background:white;border:1px dashed #cbdace;padding:25px;border-radius:16px;color:#6f8174;font-size:13px}.notice{background:#edf5ee;border:1px solid #cce2d2;color:#37644d;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;margin:12px 0}.alert{background:#fff0ed;border:1px solid #ecc9c3;color:#953c31}.smallbtn{background:none;border:0;color:#266348;text-decoration:underline;font-weight:800;font-size:12px;padding:4px}.footnote{font-size:11px;color:#7c887c;margin-top:15px;line-height:1.5}.bottomnav{position:sticky;bottom:0;background:#fff;border-top:1px solid #dde6dd;padding:9px 7px max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 -8px 24px #2a4b2d08}.nav{border:0;background:none;border-radius:10px;padding:8px 1px;color:#78897d;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:10px;font-weight:800}.nav .sym{font-size:19px}.nav.active{background:#eaf5ed;color:#1c6848}.hidden{display:none!important}.name-input{display:flex;gap:8px}.name-input input{min-width:0;flex:1}.calendar{font-size:13px;color:#6a8270}.row .value{font-size:13px;font-weight:800}.text-result{white-space:pre-wrap;font-size:12px;color:#385443;background:#f5f8f2;border-radius:12px;padding:12px;margin-top:10px}.banner{background:#f1f6e8;border:1px solid #cfdfc2;border-radius:13px;padding:12px;font-size:12px;color:#405f33;margin-bottom:16px;line-height:1.5}.pillgreen{background:#e4f3e9;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:800;color:#336d4b}.linklike{display:inline-block;margin-top:8px;font-size:12px;font-weight:800}.count{font-size:12px;color:#79877b}.full{width:100%}
@media(min-width:700px){body{padding:20px}.shell{border-radius:24px;overflow:hidden;min-height:calc(100dvh - 40px)}.bottomnav{position:sticky}}
</style>
</head><body><div class="shell"><header class="header"><div class="top"><div class="logo"><img src="./logo.png" alt="Girių inspekcijos logotipas" width="43" height="43"></div><div class="branding">Girių inspekcija<small>SAVANORIŲ DARBO VIETA</small></div><span class="pill">DEMO</span></div><h1 class="intro" id="headerTitle">Mano darbai</h1><p class="desc" id="headerSubtitle">Vienoje vietoje – užduotys, rezultatai ir savanorystės laikas.</p><div class="who"><label for="persona">Testavimo vaidmuo</label><select id="persona" aria-label="Pasirinkti demonstracinį naudotoją"><option value="asta">Asta (savanorė)</option><option value="tomas">Tomas (savanoris)</option><option value="milda">Milda (savanorė)</option><option value="koordinatorius">Koordinatorius (demo)</option></select></div></header>
<main id="main"><div class="not-live" role="note">🧪 Visi asmenys, užduotys ir pranešimai išgalvoti. Jokio tikro prisijungimo, GI bylų ar siuntimo į institucijas. Ši versija duomenis saugo tik tavo įrenginyje.</div><div id="view"></div></main>
<nav class="bottomnav" aria-label="Pagrindinis meniu"><button class="nav active" data-tab="tasks"><span class="sym">☑</span>Darbai</button><button class="nav" data-tab="report"><span class="sym">⌖</span>Pranešti</button><button class="nav" data-tab="time"><span class="sym">◷</span>Laikas</button><button class="nav" data-tab="manage"><span class="sym">▦</span>Valdymas</button><button class="nav" data-tab="feedback"><span class="sym">✎</span>Pastabos</button></nav>
</div><script>
(()=>{'use strict';
const KEY='giriu-inspekcija-demo-20261122-v1';const people={asta:'Asta (demo)',tomas:'Tomas (demo)',milda:'Milda (demo)',koordinatorius:'Koordinatorius (demo)'};
const seed=()=>({version:1,persona:'asta',tasks:[
{id:'DEMO-101',title:'Patikrinti išgalvotą miško taką',details:'Apžiūrėk bandymo teritorijos aprašą. Užduotyje nenaudojama tikra vieta.',owner:'asta',status:'Nauja',priority:'Svarbu',due:'Šiandien',result:'',created:'2026-11-22'},
{id:'DEMO-102',title:'Parengti bandomosios nuotraukos aprašymą',details:'Parašyk trumpą, išgalvotą aprašymą, tarsi rengtum medžių būklės patikrą.',owner:'tomas',status:'Priimta',priority:'Įprasta',due:'Rytoj',result:'',created:'2026-11-22'},
{id:'DEMO-103',title:'Patikrinti informacinio stendo tekstą',details:'Įvertink išgalvoto informacinio stendo skaitomumą.',owner:'milda',status:'Vykdoma',priority:'Įprasta',due:'Šią savaitę',result:'',created:'2026-11-22'},
{id:'DEMO-104',title:'Užbaigti bandomąją užduotį',details:'Ši užduotis jau turi rezultatą; išbandyk koordinatoriaus patvirtinimą.',owner:'asta',status:'Rezultatas pateiktas',priority:'Įprasta',due:'Rytoj',result:'Bandomasis įvertinimas atliktas; trūkumų nepastebėta.',created:'2026-11-22'}], logs:[],reports:[],feedback:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!state||state.version!==1||!Array.isArray(state.tasks))throw Error('bad');}catch{state=seed()}
let tab='tasks',filter='all',current=null,formOpen=false,message='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{message='Vietinė saugykla neprieinama – duomenys gali neišlikti.'}};
const id=p=>p+'-'+Math.random().toString(36).slice(2,9).toUpperCase();const date=()=>new Date().toISOString().slice(0,10);const person=()=>state.persona;
const allowed=t=>person()==='koordinatorius'||t.owner===person();
const statusClass=s=>s==='Nauja'?'new':s==='Rezultatas pateiktas'?'submitted':s==='Patvirtinta'?'approved':'';
const badge=s=>`<span class="status ${statusClass(s)}">${esc(s)}</span>`;
const titles={tasks:['Mano darbai','Užduotis galima priimti, vykdyti ir pateikti rezultatą.'],report:['Pranešti','Išbandyk pranešimo formą be tikrų vietovių.'],time:['Mano laikas','Fiksuok bandomąsias savanorystės minutes.'],manage:['Valdymas','Kurti ir tvirtinti sintetines užduotis.'],feedback:['Pastabos','Kas veikia, ką verta pataisyti?']};
function draw(){ $('persona').value=person();document.querySelectorAll('[data-tab]').forEach(el=>{el.classList.toggle('active',el.dataset.tab===tab);el.setAttribute('aria-current',el.dataset.tab===tab?'page':'false')});$('headerTitle').textContent=titles[tab][0];$('headerSubtitle').textContent=titles[tab][1];let content='';
if(tab==='tasks')content=renderTasks();if(tab==='report')content=renderReport();if(tab==='time')content=renderTime();if(tab==='manage')content=renderManage();if(tab==='feedback')content=renderFeedback();
$('view').innerHTML=(message?`<div class="notice" role="status">${esc(message)}</div>`:'')+content;message='';bindForms();}
function renderTasks(){let list=state.tasks.filter(allowed),count=list.length,act=list.filter(t=>!['Rezultatas pateiktas','Patvirtinta'].includes(t.status)).length,done=list.filter(t=>t.status==='Rezultatas pateiktas').length;
if(current){let t=state.tasks.find(x=>x.id===current&&allowed(x));if(!t){current=null}else{return `<button class="smallbtn" data-back="1">← Grįžti prie darbų</button><article class="panel" style="margin-top:10px">${badge(t.status)}<h2>${esc(t.title)}</h2><p>${esc(t.details)}</p><div class="divider"></div><p class="calendar">Vykdytojas: <b>${esc(people[t.owner])}</b> · Terminas: <b>${esc(t.due)}</b> · ${esc(t.id)}</p>${t.result?`<div class="text-result">${esc(t.result)}</div>`:''}${actionHTML(t)}</article>`}}
let filtered=list.filter(t=>filter==='all'||(filter==='active'&&!['Patvirtinta','Rezultatas pateiktas'].includes(t.status))||(filter==='sent'&&t.status==='Rezultatas pateiktas')||(filter==='done'&&t.status==='Patvirtinta'));
return `<div class="kpis"><div class="kpi"><strong>${count}</strong><span>Iš viso</span></div><div class="kpi"><strong>${act}</strong><span>Aktyvūs</span></div><div class="kpi"><strong>${done}</strong><span>Peržiūrai</span></div></div><div class="row"><h2>Užduotys</h2><span class="count">${filtered.length} rodomos</span></div><div class="filters"><button class="chip ${filter==='all'?'active':''}" data-filter="all">Visos</button><button class="chip ${filter==='active'?'active':''}" data-filter="active">Aktyvios</button><button class="chip ${filter==='sent'?'active':''}" data-filter="sent">Pateiktos</button><button class="chip ${filter==='done'?'active':''}" data-filter="done">Užbaigtos</button></div><div class="stack">${filtered.map(t=>`<article class="task"><div class="topline">${badge(t.status)}<span class="tag">${esc(t.priority)}</span></div><h3>${esc(t.title)}</h3><p>${esc(t.details)}</p><div class="divider"></div><div class="row"><span class="tiny">◷ ${esc(t.due)} · ${esc(people[t.owner])}</span><button class="smallbtn" data-open="${esc(t.id)}">Atidaryti →</button></div></article>`).join('')||'<div class="empty">Šioje grupėje užduočių nėra.</div>'}</div><p class="footnote">Norėdamas išbandyti visus vaidmenis, viršuje pasirink kitą demonstracinį naudotoją. Tai ne reali prieigų sistema.</p>`;}
function actionHTML(t){if(person()==='koordinatorius'&&t.status==='Rezultatas pateiktas')return `<div class="actions"><button class="primary" data-action="approve" data-id="${esc(t.id)}">Patvirtinti</button><button class="secondary" data-action="return" data-id="${esc(t.id)}">Grąžinti taisyti</button></div>`;
if(person()==='koordinatorius')return '<div class="notice">Koordinatoriaus testui naudok „Valdymas“ arba pasirink savanorį.</div>';
if(t.status==='Nauja')return `<div class="actions"><button class="primary" data-action="accept" data-id="${esc(t.id)}">Priimti užduotį</button></div>`;
if(t.status==='Priimta')return `<div class="actions"><button class="primary" data-action="start" data-id="${esc(t.id)}">Pradėti darbą</button></div>`;
if(t.status==='Vykdoma')return `<form id="resultForm" data-id="${esc(t.id)}"><div class="field"><label for="taskResult">Atlikto darbo rezultatas</label><textarea id="taskResult" required minlength="10" maxlength="2000" placeholder="Ką atlikai? Ko reikia toliau?"></textarea><span class="help">Mažiausiai 10 simbolių.</span></div><button type="submit" class="primary block">Pateikti rezultatą</button></form>`;
return '<div class="notice">Užduotis pateikta arba užbaigta. Kitas žingsnis – koordinatoriaus peržiūra.</div>';}
function renderReport(){return `<div class="banner">Tai tik mokomoji pranešimo forma. Nekelk tikrų nuotraukų, koordinacių ar žmonių duomenų.</div><form class="panel" id="reportForm"><h2>Naujas pranešimas</h2><div class="field"><label for="reportType">Pranešimo tipas</label><select id="reportType" required><option>Kirtimai (demo)</option><option>Tarša (demo)</option><option>Pažeistas takas (demo)</option><option>Kita (demo)</option></select></div><div class="field"><label for="reportPlace">Bandymo vietovė</label><input id="reportPlace" maxlength="100" placeholder="Pvz., Išgalvota giraitė A" required value="Išgalvota giraitė A"></div><div class="field"><label for="reportText">Kas pastebėta?</label><textarea id="reportText" required minlength="10" maxlength="1000" placeholder="Sugalvok bandomąjį aprašymą"></textarea></div><button class="primary block" type="submit">Išsaugoti demo pranešimą</button></form><h3>Bandomieji pranešimai (${state.reports.length})</h3><div class="stack">${state.reports.map(r=>`<div class="panel">${badge('Tik demo')}<h3>${esc(r.type)}</h3><p>${esc(r.place)} · ${esc(r.date)}</p><p>${esc(r.text)}</p></div>`).join('')||'<div class="empty">Dar nėra išgalvotų pranešimų.</div>'}</div>`;}
function renderTime(){let logs=state.logs.filter(l=>person()==='koordinatorius'||l.owner===person());let total=logs.reduce((n,l)=>n+l.minutes,0);
return `<div class="kpis"><div class="kpi"><strong>${Math.floor(total/60)}</strong><span>Valandos</span></div><div class="kpi"><strong>${total%60}</strong><span>Minutės</span></div><div class="kpi"><strong>${logs.length}</strong><span>Įrašai</span></div></div>${person()!=='koordinatorius'?`<form id="timeForm" class="panel"><h2>Registruoti laiką</h2><div class="field"><label for="timeTask">Užduotis</label><select id="timeTask" required>${state.tasks.filter(t=>t.owner===person()).map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}</select></div><div class="field"><label for="timeMinutes">Trukmė minutėmis</label><input id="timeMinutes" type="number" min="1" max="720" value="30" required></div><div class="field"><label for="timeNote">Ką nuveikei?</label><input id="timeNote" minlength="5" maxlength="200" required placeholder="Pvz., peržiūrėjau nuotraukas"></div><button class="primary block" type="submit">Išsaugoti laiką</button></form>`:'<div class="notice">Koordinatorius mato visus demo įrašus.</div>'}<h3>Įrašai</h3><div class="stack">${logs.slice().reverse().map(l=>`<div class="panel"><div class="row"><b>${esc(l.minutes)} min.</b><span class="tiny">${esc(l.date)}</span></div><p>${esc(l.note)}</p><span class="tag">${esc(people[l.owner])} · ${esc(l.taskId)}</span></div>`).join('')||'<div class="empty">Dar nėra laiko įrašų.</div>'}</div>`;}
function renderManage(){if(person()!=='koordinatorius')return `<div class="panel"><h2>Koordinatoriaus darbo vieta</h2><p>Pasirink viršuje „Koordinatorius (demo)“. Testavimo režime tai leidžia peržiūrėti užduočių kūrimą, paskyrimą ir tvirtinimą. Tikroje programėlėje tokias teises nustatys serveris, o ne naudotojo pasirinkimas.</p></div>`;
let awaiting=state.tasks.filter(t=>t.status==='Rezultatas pateiktas');return `<div class="kpis"><div class="kpi"><strong>${state.tasks.length}</strong><span>Užduotys</span></div><div class="kpi"><strong>${awaiting.length}</strong><span>Peržiūrai</span></div><div class="kpi"><strong>${state.reports.length}</strong><span>Pranešimai</span></div></div><form id="createForm" class="panel"><h2>Nauja sintetinė užduotis</h2><div class="field"><label for="createTitle">Pavadinimas</label><input id="createTitle" required maxlength="120" placeholder="Pvz., patikrinti bandymo vietovę B"></div><div class="field"><label for="createDetail">Aprašymas</label><textarea id="createDetail" required minlength="10" maxlength="1000" placeholder="Ką savanoris turi išbandyti?"></textarea></div><div class="field"><label for="createOwner">Vykdytojas (tik demo)</label><select id="createOwner"><option value="asta">Asta</option><option value="tomas">Tomas</option><option value="milda">Milda</option></select></div><div class="field"><label for="createPriority">Prioritetas</label><select id="createPriority"><option>Įprasta</option><option>Svarbu</option></select></div><button type="submit" class="primary block">Sukurti užduotį</button></form><h3>Laukia patvirtinimo</h3><div class="stack">${awaiting.map(t=>`<div class="panel">${badge(t.status)}<h3>${esc(t.title)}</h3><p>${esc(people[t.owner])}</p><div class="text-result">${esc(t.result)}</div><div class="actions"><button class="primary" data-action="approve" data-id="${esc(t.id)}">Patvirtinti</button><button class="secondary" data-action="return" data-id="${esc(t.id)}">Grąžinti</button></div></div>`).join('')||'<div class="empty">Nėra rezultatų, laukiančių patvirtinimo.</div>'}</div><p class="footnote">Paskyrimas ir tvirtinimas čia veikia tik šioje naršyklėje. Kitame telefone pakeitimai neatsiras, kol nebus bendro serverio.</p>`;}
function renderFeedback(){return `<form id="feedbackForm" class="panel"><h2>Pranešti apie klaidą / pasiūlymą</h2><div class="field"><label for="feedbackType">Tipas</label><select id="feedbackType"><option>Neaiškus veiksmas</option><option>Klaida</option><option>Idėja</option></select></div><div class="field"><label for="feedbackText">Pastaba (be asmens duomenų)</label><textarea required id="feedbackText" minlength="5" maxlength="1200" placeholder="Pvz., užduoties mygtukas turėtų būti didesnis"></textarea></div><button class="primary block" type="submit">Išsaugoti pastabą</button></form><h3>Mano pastabos (${state.feedback.length})</h3><div class="stack">${state.feedback.map(f=>`<div class="panel"><div class="row"><b>${esc(f.type)}</b><span class="tiny">${esc(f.date)}</span></div><p>${esc(f.text)}</p></div>`).join('')||'<div class="empty">Dar nėra pastabų.</div>'}</div><div class="panel" style="margin-top:14px"><h3>Testavimo įrankiai</h3><p>Galima eksportuoti arba importuoti tik šio demo išgalvotus duomenis. Tai ne serverinė sinchronizacija.</p><div class="actions"><button class="secondary" data-export="1">Eksportuoti demo JSON</button><button class="soft" data-import="1">Importuoti demo JSON</button></div><input type="file" id="importFile" class="hidden" accept="application/json,.json"><div class="divider"></div><button class="smallbtn" data-reset="1">Atstatyti demonstraciją nuo pradžių</button></div>`;}
function bindForms(){const c=$('createForm');if(c)c.onsubmit=e=>{e.preventDefault();let title=$('createTitle').value.trim(),details=$('createDetail').value.trim();if(!title||details.length<10)return;state.tasks.unshift({id:id('DEMO'),title,details,owner:$('createOwner').value,status:'Nauja',priority:$('createPriority').value,due:'Šią savaitę',result:'',created:date()});message='Sintetinė užduotis sukurta. Pasirink jos vykdytoją viršuje ir atsidaryk „Darbai“.';save();draw()};
const r=$('reportForm');if(r)r.onsubmit=e=>{e.preventDefault();let text=$('reportText').value.trim();if(text.length<10)return;state.reports.unshift({id:id('REPORT'),type:$('reportType').value,place:$('reportPlace').value.trim(),text,date:date()});message='Demo pranešimas išsaugotas tik šiame telefone.';save();draw()};
const t=$('timeForm');if(t)t.onsubmit=e=>{e.preventDefault();const minutes=Number($('timeMinutes').value);if(!Number.isInteger(minutes)||minutes<1||minutes>720)return;state.logs.push({id:id('TIME'),taskId:$('timeTask').value,owner:person(),minutes,note:$('timeNote').value.trim(),date:date()});message='Savanorystės laikas išsaugotas (demo).';save();draw()};
const f=$('feedbackForm');if(f)f.onsubmit=e=>{e.preventDefault();const txt=$('feedbackText').value.trim();if(txt.length<5)return;state.feedback.unshift({id:id('FEED'),type:$('feedbackType').value,text:txt,date:date()});message='Pastaba išsaugota vietoje. Ji dar nėra išsiųsta į GitHub.';save();draw()};
const rf=$('resultForm');if(rf)rf.onsubmit=e=>{e.preventDefault();let t=state.tasks.find(x=>x.id===rf.dataset.id);const text=$('taskResult').value.trim();if(!t||t.owner!==person()||t.status!=='Vykdoma'||text.length<10)return;t.result=text;t.status='Rezultatas pateiktas';save();message='Rezultatas pateiktas. Pabandyk perjungti koordinatoriaus vaidmenį.';draw()};}
document.body.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;current=null;filter='all';draw();window.scrollTo(0,0);return}
if(b.dataset.filter){filter=b.dataset.filter;draw();return}
if(b.dataset.open){current=b.dataset.open;draw();return}
if(b.dataset.back){current=null;draw();return}
if(b.dataset.action){const t=state.tasks.find(x=>x.id===b.dataset.id);if(!t||!allowed(t))return;const old=t.status,cmd=b.dataset.action;
if(cmd==='accept'&&old==='Nauja'&&person()!=='koordinatorius')t.status='Priimta';else if(cmd==='start'&&old==='Priimta'&&person()!=='koordinatorius')t.status='Vykdoma';else if(cmd==='approve'&&old==='Rezultatas pateiktas'&&person()==='koordinatorius')t.status='Patvirtinta';else if(cmd==='return'&&old==='Rezultatas pateiktas'&&person()==='koordinatorius')t.status='Vykdoma';else return;
save();message='Užduoties būsena pakeista: '+t.status;draw();return}
if(b.dataset.reset){if(confirm('Atstatyti visus šio telefono demo duomenis?')){state=seed();tab='tasks';current=null;save();draw()}return}
if(b.dataset.export){const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='giriu-inspekcija-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);return}
if(b.dataset.import){$('importFile').click();return}
});
document.body.addEventListener('change',e=>{if(e.target.id==='persona'){state.persona=e.target.value;current=null;save();draw();return}if(e.target.id==='importFile'){const file=e.target.files[0];if(!file)return;if(file.size>300000){message='Failas per didelis.';draw();return}file.text().then(txt=>{const d=JSON.parse(txt);if(d.version!==1||!Array.isArray(d.tasks)||!Array.isArray(d.logs)||!Array.isArray(d.reports)||!Array.isArray(d.feedback)||d.tasks.length>500)throw Error('invalid');state=d;state.persona=people[d.persona]?d.persona:'asta';save();message='Demo duomenys importuoti.';draw()}).catch(()=>{message='Netinkamas demonstracijos JSON failas.';draw()})}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
draw();
})();
</script></body></html>
