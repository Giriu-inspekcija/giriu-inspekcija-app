name: GI encrypted daily Supabase backup (offsite)
on:
  schedule:
    # 02:23 UTC every day; does NOT build or deploy Netlify.
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: gi-database-daily-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'Giriu-inspekcija/giriu-inspekcija-app' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GI_BACKUP_AGE_RECIPIENT: ${{ vars.GI_BACKUP_AGE_RECIPIENT }}
      GI_BACKUP_OUTPUT_DIR: /tmp/gi-encrypted
    steps:
      - uses: actions/checkout@v4
      - name: Check the required secrets without displaying them
        env:
          GI_BACKUP_DB_URL: ${{ secrets.GI_BACKUP_DB_URL }}
          GI_BACKUP_SERVICE_ROLE_KEY: ${{ secrets.GI_BACKUP_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GI_BACKUP_DB_URL GI_BACKUP_SERVICE_ROLE_KEY GI_BACKUP_AGE_RECIPIENT; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing required repository secret/variable: $name"
              exit 1
            fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: 2.83.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption and Storage client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          python -m pip install requests==2.32.5
      - name: Encrypt full SQL and Storage snapshot
        env:
          GI_BACKUP_DB_URL: ${{ secrets.GI_BACKUP_DB_URL }}
          GI_BACKUP_SERVICE_ROLE_KEY: ${{ secrets.GI_BACKUP_SERVICE_ROLE_KEY }}
        id: snapshot
        shell: bash
        run: bash scripts/gi_backup.sh
      - name: Retain encrypted snapshot separately from Supabase (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: gi-encrypted-backup-${{ github.run_id }}
          path: /tmp/gi-encrypted/*.age
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Authorize GI Shared Drive with short-lived identity
        id: drive_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/920770676962/locations/global/workloadIdentityPools/github-backup/providers/github
          service_account: gi-backup-writer@gi-backup-516018.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Required immutable encrypted mirror to GI Shared Drive
        env:
          GI_DRIVE_ACCESS_TOKEN: ${{ steps.drive_auth.outputs.access_token }}
        run: python3 scripts/gi_backup_drive.py
      - name: Successful backup status
        shell: bash
        run: |
          echo "### GI encrypted backup" >> "$GITHUB_STEP_SUMMARY"
          echo "Database SQL, auth records, Storage metadata and object bytes exported and encrypted." >> "$GITHUB_STEP_SUMMARY"
          echo "Encrypted GitHub artifact retained for 30 days." >> "$GITHUB_STEP_SUMMARY"
          echo "Required GI Shared Drive mirror verified." >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve stale backup failure alert after a verified successful backup
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          current="$(gh issue list --state open --search 'GI BACKUP FAILED in:title' --json number --jq '.[0].number' 2>/dev/null)"
          if [[ -n "$current" ]]; then
            gh issue comment "$current" --body "Šifruota duomenų bazės ir Storage kopija šiame vykdyme sėkmingai įkelta į atskirą saugyklą. Tai NĖRA pilno atkūrimo testo įrodymas: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            gh issue close "$current"
          fi
      - name: Create or update one visible failure issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          title="GI BACKUP FAILED: patikrinti atsargines kopijas"
          body="Automatinė šifruota kopija NEPATVIRTINTA. Tikrinkite vykdymą: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Negalima aktyvuoti realių GI bylų, kol nepatvirtintas sėkmingas pilnas eksportas ir atkūrimo bandymas. Niekada nedėkite slaptų raktų į issue."
          current="$(gh issue list --state open --search 'GI BACKUP FAILED in:title' --json number --jq '.[0].number' 2>/dev/null)"
          if [[ -n "$current" ]]; then
            gh issue comment "$current" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
