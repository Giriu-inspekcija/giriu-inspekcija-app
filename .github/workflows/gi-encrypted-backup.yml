name: GI encrypted daily Supabase backup (offsite)
on:
  schedule:
    # 02:23 UTC every day; does NOT build or deploy Netlify.
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: gi-database-daily-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'Giriu-inspekcija/giriu-inspekcija-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GI_BACKUP_DB_URL: ${{ secrets.GI_BACKUP_DB_URL }}
      GI_BACKUP_SERVICE_ROLE_KEY: ${{ secrets.GI_BACKUP_SERVICE_ROLE_KEY }}
      GI_BACKUP_AGE_RECIPIENT: ${{ vars.GI_BACKUP_AGE_RECIPIENT }}
      GI_BACKUP_OUTPUT_DIR: /tmp/gi-encrypted
      GI_BACKUP_RCLONE_CONFIG_B64: ${{ secrets.GI_BACKUP_RCLONE_CONFIG_B64 }}
      GI_BACKUP_DRIVE_FOLDER_ID: ${{ vars.GI_BACKUP_DRIVE_FOLDER_ID }}
      GI_BACKUP_DRIVE_REQUIRED: ${{ vars.GI_BACKUP_DRIVE_REQUIRED }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the required secrets without displaying them
        shell: bash
        run: |
          set -euo pipefail
          for name in GI_BACKUP_DB_URL GI_BACKUP_SERVICE_ROLE_KEY GI_BACKUP_AGE_RECIPIENT; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing required repository secret/variable: $name"
              exit 1
            fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: 2.83.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption, Drive sync and Storage client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          if [[ -n "$GI_BACKUP_RCLONE_CONFIG_B64" ]]; then sudo apt-get install -y -qq rclone; fi
          python -m pip install requests==2.32.5
      - name: Encrypt full SQL and Storage snapshot
        id: snapshot
        shell: bash
        run: bash scripts/gi_backup.sh
      - name: Retain encrypted snapshot separately from Supabase (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: gi-encrypted-backup-${{ github.run_id }}
          path: /tmp/gi-encrypted/*.age
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Check required Drive configuration after retaining GitHub snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GI_BACKUP_DRIVE_REQUIRED" == true && ( -z "$GI_BACKUP_RCLONE_CONFIG_B64" || -z "$GI_BACKUP_DRIVE_FOLDER_ID" ) ]]; then
            echo '::error::Required Drive mirror lacks credentials or explicit folder ID'
            exit 1
          fi
      - name: Optional offsite copy to GI Google Drive folder
        if: env.GI_BACKUP_RCLONE_CONFIG_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config="$(mktemp "$RUNNER_TEMP/gi-rclone.XXXXXX")"
          trap 'rm -f "$config"' EXIT
          printf '%s' "$GI_BACKUP_RCLONE_CONFIG_B64" | base64 --decode > "$config"
          folder="${GI_BACKUP_DRIVE_FOLDER_ID:-1_1ZxYmh5DehDWhezR4FN5eUms93YdVrM}"
          [[ "$folder" =~ ^[A-Za-z0-9_-]+$ ]]
          file="$(find "$GI_BACKUP_OUTPUT_DIR" -maxdepth 1 -name '*.age' -type f -print -quit)"
          test -s "$file"
          rclone --config "$config" copyto "$file" "gidrive:$(basename "$file")" \
            --drive-root-folder-id "$folder" --checksum --immutable --retries 3
          rclone --config "$config" check "$GI_BACKUP_OUTPUT_DIR" gidrive: \
            --drive-root-folder-id "$folder" --one-way --include "/$(basename "$file")" --checkers 1
          echo "Encrypted copy mirrored to GI Drive." >> "$GITHUB_STEP_SUMMARY"
      - name: Successful backup status
        shell: bash
        run: |
          echo "### GI encrypted backup" >> "$GITHUB_STEP_SUMMARY"
          echo "Database SQL, auth records, Storage metadata and object bytes exported and encrypted." >> "$GITHUB_STEP_SUMMARY"
          echo "Encrypted GitHub artifact retained for 30 days." >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$GI_BACKUP_RCLONE_CONFIG_B64" ]]; then
            echo 'Drive mirror not configured; GitHub copy only.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve stale backup failure alert after a verified successful backup
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          current="$(gh issue list --state open --search 'GI BACKUP FAILED in:title' --json number --jq '.[0].number' 2>/dev/null)"
          if [[ -n "$current" ]]; then
            gh issue comment "$current" --body "Šifruota duomenų bazės ir Storage kopija šiame vykdyme sėkmingai įkelta į atskirą saugyklą. Tai NĖRA pilno atkūrimo testo įrodymas: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            gh issue close "$current"
          fi
      - name: Create or update one visible failure issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          title="GI BACKUP FAILED: patikrinti atsargines kopijas"
          body="Automatinė šifruota kopija NEPATVIRTINTA. Tikrinkite vykdymą: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Negalima aktyvuoti realių GI bylų, kol nepatvirtintas sėkmingas pilnas eksportas ir atkūrimo bandymas. Niekada nedėkite slaptų raktų į issue."
          current="$(gh issue list --state open --search 'GI BACKUP FAILED in:title' --json number --jq '.[0].number' 2>/dev/null)"
          if [[ -n "$current" ]]; then
            gh issue comment "$current" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
