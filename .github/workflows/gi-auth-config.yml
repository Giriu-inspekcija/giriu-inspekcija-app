name: GI Auth templates and redirect configuration

on:
  pull_request:
    paths:
      - 'scripts/sync-supabase-auth.mjs'
      - 'tests/auth-config.test.mjs'
      - 'supabase/email-templates/**'
      - '.github/workflows/gi-auth-config.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-supabase-auth.mjs'
      - 'tests/auth-config.test.mjs'
      - 'supabase/email-templates/**'
      - '.github/workflows/gi-auth-config.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-GI-AUTH to apply approved Auth changes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gi-supabase-auth-admin
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check scripts/sync-supabase-auth.mjs
      - run: node --test tests/auth-config.test.mjs
      - run: node scripts/sync-supabase-auth.mjs --check

  apply:
    # The only job with secrets. Never run on PR / fork code.
    # Protect environment "gi-auth-admin" with required reviewer and main-only deployments.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY-GI-AUTH'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: gi-auth-admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate templates before accessing credentials
        run: node scripts/sync-supabase-auth.mjs --check
      - name: Plan narrow Auth Management API PATCH
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
        run: node scripts/sync-supabase-auth.mjs --plan
      - name: Apply and verify narrow Auth Management API PATCH
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          GI_AUTH_ALLOW_APPLY: 'true'
        run: node scripts/sync-supabase-auth.mjs --apply
