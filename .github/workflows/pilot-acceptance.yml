name: Pilot user journeys
on:
  pull_request:
    paths: ['pilot/**', 'supabase/migrations/**', 'tests/acceptance/**', '.github/workflows/pilot-acceptance.yml']
  workflow_dispatch:
  schedule:
    # Isolated database + real browser interactions three times weekly.
    # Testing does not push code and does not deploy to Netlify.
    - cron: "17 5 * * 1,3,5"
permissions:
  contents: read
concurrency:
  group: gi-pilot-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.83.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start a disposable local Supabase project
        run: |
          supabase init
          python - <<'PY'
          from pathlib import Path
          path=Path('supabase/config.toml')
          head,section=path.read_text().split('[auth.email]',1)
          section=section.replace('enable_confirmations = false','enable_confirmations = true',1)
          path.write_text(head+'[auth.email]'+section)
          PY
          supabase start -x studio,vector,logflare,imgproxy,realtime,edge-runtime
      - name: Install browser test tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
          pip install requests==2.32.5 playwright==1.60.0
          python -m playwright install --with-deps chromium webkit
          curl --fail --silent --show-error --retry 3 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2 -o "$RUNNER_TEMP/gi-sdk.js"
      - name: Run real volunteer, reviewer, email and browser journeys
        run: |
          supabase status -o env > "$RUNNER_TEMP/gi-local.env"
          set -a
          source "$RUNNER_TEMP/gi-local.env"
          set +a
          QA_VOLUME=1 QA_BROWSER=1 GI_TEST_SDK="$RUNNER_TEMP/gi-sdk.js" python tests/acceptance/pilot.py
      - name: Validate real backup CLI export flags on isolated synthetic database
        run: |
          supabase status -o env > "$RUNNER_TEMP/gi-backup-local.env"
          set -a
          source "$RUNNER_TEMP/gi-backup-local.env"
          set +a
          bash tests/acceptance/backup_cli_smoke.sh "$DB_URL"
      - name: Restore a real encrypted synthetic snapshot into a second isolated Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/gi-backup-local.env"
          set +a
          bash tests/acceptance/isolated_restore_smoke.sh "$DB_URL" "$API_URL" "$SERVICE_ROLE_KEY"
