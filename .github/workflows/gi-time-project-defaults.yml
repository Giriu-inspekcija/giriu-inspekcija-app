name: GI automatic project attribution acceptance
on:
  pull_request:
    paths:
      - 'scripts/gi_time_project_defaults.sql'
      - 'tests/acceptance/time_project_defaults.py'
      - 'pilot/app.js'
      - 'pilot/index.html'
      - '.github/workflows/gi-time-project-defaults.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gi-project-defaults-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  local-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.83.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate migration with CLI, only on disposable runner
        run: |
          supabase init
          supabase migration new gi_time_project_defaults
          migration="$(find supabase/migrations -name '*_gi_time_project_defaults.sql' -print -quit)"
          cp scripts/gi_time_project_defaults.sql "$migration"
          echo "Generated migration: $migration"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('supabase/config.toml')
          head,section=path.read_text().split('[auth.email]',1)
          section=section.replace('enable_confirmations = false','enable_confirmations = true',1)
          path.write_text(head+'[auth.email]'+section)
          PY
      - name: Start isolated local test stack
        run: supabase start -x studio,vector,logflare,imgproxy,realtime,edge-runtime
      - name: Test actual REST authorization, defaults, expiry, and correction
        run: |
          python -m pip install requests==2.32.5 playwright==1.60.0
          python -m playwright install --with-deps chromium
          curl --fail --silent --show-error --location https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2 -o "$RUNNER_TEMP/gi-project-sdk.js"
          supabase status -o env > "$RUNNER_TEMP/gi-local.env"
          set -a
          source "$RUNNER_TEMP/gi-local.env"
          set +a
          QA_PROJECT_BROWSER=1 GI_TEST_SDK="$RUNNER_TEMP/gi-project-sdk.js" python tests/acceptance/time_project_defaults.py
      - name: Run database advisors
        run: supabase db advisors --local
      - name: Store CLI-generated migration for deployment review
        uses: actions/upload-artifact@v4
        with:
          name: gi-project-default-migration
          path: supabase/migrations/*_gi_time_project_defaults.sql
          retention-days: 7
