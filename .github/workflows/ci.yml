name: Synthetic pilot static contract checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Cheap read-only tests twice daily, in UTC; no Netlify build or deploy.
    - cron: '37 4,16 * * *'
permissions:
  contents: read
concurrency:
  group: synthetic-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pilot/app.js
      - run: npm test
